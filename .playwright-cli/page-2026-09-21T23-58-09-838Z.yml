            - generic [ref=f3e141]:
              - term [ref=f3e142]: Output
              - definition [ref=f3e143]: Cleaned partitioned Parquet datasets ready for BI/SQL ingestion, plus a 2-page executive summary spreadsheet generated in 8 minutes 42 seconds.
            - generic [ref=f3e144]:
              - term [ref=f3e145]: Result
              - definition [ref=f3e146]: Reduced a process that previously stalled spreadsheet applications and required several days of fragmented human wrangling into an 8.7-minute unattended script run with zero dropped rows.

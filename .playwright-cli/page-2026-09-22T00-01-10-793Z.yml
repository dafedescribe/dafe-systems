      - generic [ref=f14e115]:
        - generic [ref=f14e116]:
          - generic [ref=f14e117]: Pipeline Code Extract
          - generic [ref=f14e121]: Implementation Extract
        - code [ref=f14e123]: "import polars as pl def process_chunk_stream(file_path: str, chunk_size: int = 50_000): schema_overrides = {\"record_id\": pl.Utf8, \"amount\": pl.Utf8, \"event_ts\": pl.Utf8} reader = pl.read_csv_batched(file_path, batch_size=chunk_size, schema_overrides=schema_overrides) total_processed = 0 while (batches := reader.next_batches(5)): for batch in batches: cleaned = ( batch.lazy() .filter(pl.col(\"record_id\").is_not_null()) .with_columns([ pl.col(\"amount\").str.replace_all(r\"[^0-9.-]\", \"\").cast(pl.Float64, strict=False), pl.col(\"event_ts\").str.to_datetime(\"%Y-%m-%d %H:%M:%S\", strict=False) ]) .collect() ) total_processed += len(cleaned) return total_processed"

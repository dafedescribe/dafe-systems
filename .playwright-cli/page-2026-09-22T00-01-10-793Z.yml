        - generic [ref=f14e46]: Operational Context
        - generic [ref=f14e47]: What was happening?
        - paragraph [ref=f14e48]: Large tabular exports containing customer transaction histories, multi-currency ledger rows, and inventory movement logs needed repeated consolidation, deduplication, schema normalization, and validation for downstream reporting. Standard spreadsheet software repeatedly crashed, froze, or truncated rows when dealing with over 150,000 entries.
      - generic [ref=f14e49]:
        - generic [ref=f14e50]: Technical Constraints
        - generic [ref=f14e51]: What made it challenging?
        - paragraph [ref=f14e52]: Memory limits on standard local hardware (16GB RAM) prevented loading the entire raw 1.2M+ row CSV/XLSX into memory at once. Furthermore, date strings used inconsistent formats (ISO-8601, DD/MM/YYYY, MM/DD/YYYY) and numeric columns had sporadic currency symbols and trailing spaces.
    - generic [ref=f14e53]:
      - generic [ref=f14e54]: Engineering Solution
      - generic [ref=f14e55]: What was built?
      - paragraph [ref=f14e56]: Designed a lightweight chunk-based data pipeline in Python using Polars and generator-based streaming routines. The engine ingests files in 50,000-row chunks, applies deterministic cleaning functions (regex normalization, vectorized date parsing, ISO currency conversion), performs hashing for duplicate detection, and writes compressed, queryable Parquet partitions along with a consolidated analytical summary.

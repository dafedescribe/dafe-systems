            - heading "1,000,000+ Rows Processed in Under 10 Minutes" [level=2] [ref=f9e103]
            - paragraph [ref=f9e104]: A chunked Python batch processing engine replacing manual spreadsheet work with deterministic transformations.
            - paragraph [ref=f9e105]:
              - strong [ref=f9e106]: "Constraint:"
              - text: Memory limits on standard local hardware (16GB RAM) prevented loading the entire raw 1.2M+ row CSV/XLSX into memory at once. Furthermore, date strings used inconsistent formats (ISO-8601, DD/MM/YYYY, MM/DD/YYYY) and numeric columns had sporadic currency symbols and trailing spaces.
            - link "Read case study" [ref=f9e107] [cursor=pointer]:
              - /url: /work/million-row-pipeline
          - generic [ref=f9e111]:
            - generic [ref=f9e112]:
              - term [ref=f9e113]: Input
              - definition [ref=f9e114]: Unstructured multi-format CSV exports and legacy ledger dumps totaling 1,140,000+ rows.
            - generic [ref=f9e115]:
              - term [ref=f9e116]: Output
              - definition [ref=f9e117]: Cleaned partitioned Parquet datasets ready for BI/SQL ingestion, plus a 2-page executive summary spreadsheet generated in 8 minutes 42 seconds.
            - generic [ref=f9e118]:
              - term [ref=f9e119]: Result
              - definition [ref=f9e120]: Reduced a process that previously stalled spreadsheet applications and required several days of fragmented human wrangling into an 8.7-minute unattended script run with zero dropped rows.
        - article [ref=f9e121]:

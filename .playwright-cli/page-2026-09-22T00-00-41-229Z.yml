            - paragraph [ref=f9e128]:
              - strong [ref=f9e129]: "Constraint:"
              - text: Documents lack uniform templates. A single PDF might interleave billing addresses, technical drawings, general terms, and tabular item tables with nested sub-items.
            - link "Read case study" [ref=f9e130] [cursor=pointer]:
              - /url: /work/industrial-rfq-intake

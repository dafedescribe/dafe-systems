              - definition [ref=f9e140]: Normalized internal RFQ draft in ERP/Airtable review queue with 95% of administrative re-keying completed.
            - generic [ref=f9e141]:
              - term [ref=f9e142]: Result
              - definition [ref=f9e143]: Cut estimator prep time from 25 minutes per complex request to under 3 minutes of focused human verification.

      - generic [ref=f13e35]: Specification Intake & RFQ Architecture
      - heading "Organise the RFQ before your team starts quoting." [level=1] [ref=f13e36]
      - generic [ref=f13e37]:
        - paragraph [ref=f13e38]: Industrial RFQs rarely arrive in clean, standardized formats. They land across customer email threads as dense multi-page PDFs, technical drawings, and ad-hoc spreadsheets with ambiguous customer part numbers.
        - paragraph [ref=f13e39]: Before an estimator or sales engineer can evaluate margins and calculate bids, staff spend hours manually re-typing specifications, validating line items, and cross-referencing internal ERP catalogs.
        - paragraph [ref=f13e40]: Deterministic automation handles this entire extraction layer—parsing raw attachments and delivering structured quotation drafts directly into your existing workflow.
